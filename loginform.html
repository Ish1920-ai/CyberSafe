<!doctype html>
<html> 
    <head>
        <meta charset="utf-8">
        <meta name="viewport">
        <title>Login form</title>
        <link rel="icon" type="image/jpeg" href="../pictures/girl.jpg">
        <link rel="stylesheet" href="style/styleloginform.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    </head>
    <body>
        <div class="blur1"></div>
        <div class="blur2"></div>
        <main>
            <div class="head">
                <h1>Heyy</h1>
                <h2>Welcome to Cyber<span>Safe</span>.</h2>
            </div>
            <div class="form">
                <form action="index.html">  
                    <label for="username" required>Username:</label><br>
                    <input type="text" placeholder="Your name" required><br><br>
                    <label for="pwd" required>Password:</label><br>
                    <input type="password" id="pwd" placeholder="............." required>
                    <button type="button" class="eye">
                        <i class="fa-regular fa-eye"></i>
                    </button><br><br>
                    <input type="checkbox" id="remember" name="remember" value="Remember me">
                    <label for="remember">Remember me</label><br><br><br>        
                    <button type="submit" class="btn">Submit</button><br><br><br>
                    <p>or Continue with</p>
                    <nav>
                        <div class="icon">
                            <a href="https://www.facebook.com"><img src="../pictures/facebook.png"></a>
                            <span class="tooltip">Facebook</span>
                        </div>
                        <div class="icon">
                            <a href="https://www.google.com"><img src="../pictures/google.png"></a>
                            <span class="tooltip">Google</span>
                        </div>
                        <div class="icon">
                            <a href="https://in.linkedin.com"><img src="../pictures/linkedin.png"></a>
                            <span class="tooltip">Linkedin</span>
                        </div>
                    </nav>
                </form>
            </div>
        </main>
    </body>
</html>
