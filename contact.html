<!DOCTYPE html>
<html>
    <head>
        <title>CyberSafe</title>
        <meta name="viewport" content="width=device-width initial-scale=1.0">
        <link rel="stylesheet" href="style/stylecontact.css">
    </head>
    <body>
        <div class="grid-container">
            <div class="blur1"></div>
            <div class="blur2"></div>
            <nav class="navbar">
            <div class="icon">
                <h1>Cyber<span class="span">Safe</span></h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="report.html">Report</a></li>
                <li><a href="contact.html">Contact us</a></li>
            </ul>
        </nav>
            <main class="contact-grid">
                <section class="contact-info">
                    <h2>Get in Touch</h2>
                    <p>Email: support@cybersafe.com</p>
                    <p>Phone: +91 12345 67890</p>
                    <p>Location: Jaipur, India</p>
                    <p>We are here to help you learn about online safety and report cyber-related concerns.</p>
                </section>
                <section class="contact-form">
                    <h2>Send Us a Message</h2>
                    <form>
                        <label>Name</label><br>
                        <input type="text" placeholder="Your Name" required><br><br>
                        <label>Age</label><br>
                        <input type="text" placeholder="Enter your age here"><br><br>
                        <label>Email</label><br>
                        <input type="email" placeholder="abc123@email.com" required><br><br>
                        <label>Message</label><br>
                        <textarea rows="3" placeholder="Give detail of the issue you are facing..."></textarea><br><br>
                        <button type="submit">Send Message</button>
                    </form>
                </section>
            </main>
        </div>
        <footer>
            <p>&copy; CyberSafe 2026.</p>
        </footer>
    </body>
</html>
